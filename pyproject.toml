[project]
name = "mostrador-copilot"
version = "0.1.0"
description = "Sales back office with evidence-based recommendations and human review"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "boto3>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mostrador"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "docs", "examples", "data", "pyproject.toml", "uv.lock",
  "README.md", "CONEXT.md", "PRODUCT.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md",
  "Dockerfile", ".dockerignore", ".env.example", ".gitignore", ".github",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
